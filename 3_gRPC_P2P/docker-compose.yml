services:
  servidor:
    build: .
    image: 3_grpc_p2p
    hostname: diegom-servidor
    command: ["python3", "server.py"]
    ports:
      - "50051:50051"
  cliente:
    build: .
    image: 3_grpc_p2p
    hostname: diegom-cliente
    command: ["python3", "client.py"]
    environment:
      - SERVIDOR=${SERVIDOR}
